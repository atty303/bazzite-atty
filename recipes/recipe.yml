---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# image will be published to ghcr.io/<user>/<name>
name: bazzite-atty
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  - type: containerfile
    no-cache: false
    snippets:
      - COPY --from=ghcr.io/ublue-os/akmods:main-44 / /tmp/akmods-common
      - COPY --from=ghcr.io/ublue-os/akmods-extra:ogc-44 / /tmp/akmods-common
      - RUN find /tmp/akmods-common
      - RUN dnf install /tmp/akmods-common/rpms/ublue-os/ublue-os-akmods*.rpm
      - RUN dnf install -y /tmp/akmods-common/rpms/kmods/kmod-openrazer*.rpm /tmp/akmods-common/rpms/common/openrazer-kmod*.rpm
      - RUN dnf install -y /tmp/akmods-common/rpms/kmods/kmod-new-lg4ff*.rpm

  - type: bling
    install:
      - 1password

  - type: dnf
    repos:
      cleanup: true
      copr:
        - basilcrow/uwsm
        - scottames/ghostty
      files:
        - https://raw.githubusercontent.com/atty303/howdy-rpm/refs/heads/main/howdy.repo
    install:
      packages:
        - xdg-desktop-portal-wlr
        # howdy.repo
        - howdy
        - howdy-selinux
        # basilcrow/uwsm
        - uwsm
        # scottames/ghostty
        - ghostty

  - type: default-flatpaks
    configurations:
      - scope: user

  - type: signing
